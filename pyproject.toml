# Tooling configuration. The project is deliberately dependency-light at
# runtime; everything configured here is a development-time tool.

[tool.ruff]
target-version = "py311"
line-length = 88
# Migration files are generated by Alembic. Editing them by hand would be
# overwritten on the next `alembic revision`, so they are not linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E4/E7/E9 + F: pyflakes and the pycodestyle errors that actually catch bugs.
# I  : import sorting.   B : bugbear.   UP: pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    # FastAPI's `Depends(...)` / `Query(...)` defaults are the framework's
    # documented idiom, not a mutable-default bug.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# `alembic/env.py` imports models purely to register them on the metadata.
"alembic/env.py" = ["E402"]
# The test module names come from DESIGN.md, not from a naming convention.
"Test/*" = ["N999"]
