[pytest]
# The test module names come straight from DESIGN.md, so they do not follow
# pytest's default `test_*.py` convention - list them explicitly.
testpaths = Test
python_files = Unauthenticated_Access.py Forbidden_Access.py Forbidden_Export_Access.py Invalid_Input.py Resource_Not_Found.py Conflict.py Export_Lifecycle.py
pythonpath = .
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
